aid: limehome
name: Limehome
description: 'Limehome is a Munich-headquartered digital hospitality operator founded in 2018 that designs,
  leases and runs fully-equipped design apartments and aparthotels across Europe, from Berlin to Barcelona
  and Linz to Lecce. The company runs a 100% digital guest journey: guests browse and book units online,
  receive an access code, and complete check-in and check-out contactlessly with no on-site reception
  staff. Limehome operates offices in Munich and Madrid with more than 200 employees, is led by CEOs Dr.
  Josef Vollmayr and Cesar de Sousa Freitas, and is backed by Picus Capital, HV Capital and Lakestar.
  Revenue comes from direct bookings (fee-free, with a 15% membership discount) alongside a "Lease to
  Limehome" real-estate partnership model. Limehome runs a production API host at api.limehome.com behind
  AWS API Gateway, but publishes no public developer portal, documentation or machine-readable
  specification; that surface is first-party/private. The company does maintain a public GitHub
  organization with a small number of open-source engineering libraries, and an engineering blog.'
